# -----------------------------------------------------------------------------
# Continuous integration: every pull request, and the quality gate of the
# Release workflow (workflow_call) on every push to main. No `push` trigger of
# its own on main: release.yml runs it there, so a release is never cut from a
# commit whose checks failed.
#
#   1. Prettier, ESLint and the tests, on Node 22 (the oldest version
#      `engines` accepts) and Node 24 (the one the image ships with);
#   2. the store admission checks, without the image check (the image of a
#      version only exists once it is released);
#   3. the Docker image, built for amd64 and never pushed, then started like
#      Gladys runs it: a broken Dockerfile or a module that does not load
#      shows up here rather than in a release.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Checks only read the code: no write scope for the token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Validate the manifest, the cover and the docs
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as build.yml, without pushing, and for amd64 only: emulating
      # arm64 is slow, and only the release build needs it.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: gladys-voltalis:ci

      # The image as Gladys runs it (read-only, unprivileged, 256 MB, no
      # network): every module loads, a heater with every mode becomes a
      # device of 4 features (mode, preset, setpoint, energy index), a relay a
      # device of 2 (mode, energy index), the home a device of 2 (power,
      # energy index), /data/state.json is written with mode 0600.
      # Update the counts with the features.
      - name: Smoke test of the image
        run: |
          set -euo pipefail
          docker run --rm --read-only --memory 256m --network none --user node \
            --tmpfs /data:uid=1000,gid=1000 --entrypoint node gladys-voltalis:ci \
            --input-type=module -e "
              const { createApp } = await import('/app/src/app.js');
              const { parseAppliances } = await import('/app/src/voltalis.js');
              const { buildDevice } = await import('/app/src/device.js');
              const { createState } = await import('/app/src/state.js');
              const { statSync } = await import('node:fs');
              const ids = { externalIds: (type, id) => ({ device: 'ext:voltalis:' + type + ':' + id, feature: (key) => 'ext:voltalis:' + type + ':' + id + ':' + key }) };
              const [heater, relay] = parseAppliances([
                { id: 10, name: 'Living room', applianceType: 'HEATER', modulatorType: 'VX_WIRE', availableModes: ['ECO', 'CONFORT', 'TEMPERATURE', 'HORS_GEL'], programming: { progType: 'DEFAULT', isOn: true, mode: 'CONFORT', temperatureTarget: 19 } },
                { id: 11, name: 'Water heater', applianceType: 'WATER_HEATER', modulatorType: 'VX_RELAY', availableModes: ['NORMAL'], programming: { progType: 'USER', isOn: false, mode: 'NORMAL' } },
              ]);
              const heaterDevice = buildDevice(ids, heater);
              const relayDevice = buildDevice(ids, relay);
              const home = buildDevice(ids, { isSite: true, id: '1', name: '', city: 'Lyon' });
              const state = createState({ path: '/data/state.json' });
              state.setSnapshot('10', { state: 'comfort', manual: false, health: 'ok' });
              state.save();
              const mode = statSync('/data/state.json').mode & 0o777;
              if (typeof createApp !== 'function' || heaterDevice.features.length !== 4 || relayDevice.features.length !== 2 || home.features.length !== 2 || mode !== 0o600 || typeof fetch !== 'function') {
                process.exit(1);
              }
              console.log('modules load, 4 features for a heater, 2 for a relay, 2 for the home, /data/state.json is 0600');
            "
